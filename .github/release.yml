# Groups the generated release notes by the label on each pull request.
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Features
      labels: [enhancement]
    - title: Content
      labels: [content]
    - title: Fixes
      labels: [bug]
    - title: Accessibility
      labels: [accessibility]
    - title: Docs
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ['*']
