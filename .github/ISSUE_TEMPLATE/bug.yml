name: Report a bug
description: Something on the site does not work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Page and browser
      placeholder: Playground, Safari 26 on an iPhone
    validations:
      required: true
