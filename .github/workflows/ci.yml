name: CI

# A private repo on the free plan has limited Actions minutes, so CI runs once per PR.
# Main only changes by merging a passing PR, so pushes to main run nothing.
# Draft PRs and changes only to docs skip it too. Run it by hand from the Actions tab if needed.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - 'CITATION.cff'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  # The browser tests only matter when the site, the engine, the model or the packages change.
  # A change to repo files alone, such as templates, workflows or notes, skips them.
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ] || git diff --name-only "$BASE" HEAD | grep -qE '^(site|packages|models)/|^package(-lock)?\.json$'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  # One job per browser, side by side. Together they ran close to the 30 minute limit.
  e2e:
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    # WebKit is the slowest browser and has taken over 20 minutes on a busy runner.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: webkit
            browser: webkit
          - project: firefox
            browser: firefox
          - project: mobile
            browser: webkit
    name: e2e (${{ matrix.project }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: site
      # Straight to Playwright, since npm would keep --project for itself.
      - run: npx playwright test --project=${{ matrix.project }}
        working-directory: site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-results-${{ matrix.project }}
          path: site/test-results
          retention-days: 7
