# Once a month, one grouped PR per kind, so updates cost few Actions minutes.
# Security fixes still come as soon as GitHub knows of them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Rebasing on every merge to main would rerun CI each time.
    rebase-strategy: disabled
    # A new major version comes in a PR of its own, so it cannot hold the others back.
    ignore:
      # TypeScript 7 breaks typescript-eslint and astro check for now.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # The types follow the Node version the site runs on, 24 LTS.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Rebasing on every merge to main would rerun CI each time.
    rebase-strategy: disabled
    groups:
      actions:
        patterns: ['*']
